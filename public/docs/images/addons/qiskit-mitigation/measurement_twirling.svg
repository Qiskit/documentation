<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="351" height="100" viewBox="0 0 351 100" font-family="Helvetica, Arial, sans-serif">
  <rect width="351" height="100" fill="#ffffff"/>

  <!-- highlighted backgrounds -->
  <rect x="0" y="23" width="150" height="52" fill="#d0e2fa"/>
  <rect x="190" y="23" width="161" height="52" fill="#d0e2fa"/>

  <!-- left circuit: wire, meter, classical (double) wire -->
  <path d="M0 49H42" stroke="#555" stroke-width="1.2" fill="none"/>
  <path d="M78 47H158M78 52H158" stroke="#555" stroke-width="1.2" fill="none"/>
  <rect x="42" y="31" width="36" height="36" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <g stroke="#555" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M49 58A11 11 0 0 1 71 58"/>
    <path d="M60 57L68 43"/>
  </g>
  <circle cx="60" cy="57" r="1.8" fill="#555"/>

  <!-- equivalence sign -->
  <text x="170" y="55" font-size="16" fill="#333" text-anchor="middle">≡</text>

  <!-- right circuit: X gate, meter, classical wire, NOT -->
  <path d="M190 49H208M244 49H268M304 47H326M304 52H326" stroke="#555" stroke-width="1.2" fill="none"/>
  <rect x="208" y="31" width="36" height="36" fill="#1565f2"/>
  <text x="226" y="57" font-size="19" fill="#ffffff" text-anchor="middle">X</text>
  <rect x="268" y="31" width="36" height="36" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <g stroke="#555" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M275 58A11 11 0 0 1 297 58"/>
    <path d="M286 57L294 43"/>
  </g>
  <circle cx="286" cy="57" r="1.8" fill="#555"/>
  <path d="M326 33L351 49L326 65Z" fill="#ffffff" stroke="#555" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="334" y="53" font-size="7" font-weight="bold" fill="#333" text-anchor="middle">NOT</text>
</svg>
