<svg width="960" height="424" viewBox="0 0 960 424" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">File storage is shared by your local notebook and every run of the workflow</title>
<style>
text{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-size:16px;fill:#161616}
.m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12px;fill:#525252}
.h{font-weight:600}.w{fill:#FFFFFF}.big{font-size:20px}
.bar{fill:#121619}.o{stroke:#161616}
.b{fill:#F6F2FF;stroke:#8A3FFC}.bl{fill:#0F62FE}
.p{fill:none;stroke:#8D8D8D;stroke-dasharray:2 2}.pw{fill:none;stroke:#C6C6C6;stroke-dasharray:2 2}
.ln{stroke:#161616;fill:none;stroke-width:1.5}.ah{fill:#161616}
</style>
<defs>
<marker id="h" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="t" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M8,0 L0,4 L8,8 z"/></marker>
</defs>
<rect class="bar" x="48" y="48" width="240" height="328" rx="4"/>
<text class="w" x="64" y="80">Your local notebook</text>
<text class="m w" x="64" y="108">Client file methods</text>
<rect class="pw" x="64.5" y="124.5" width="160" height="23" rx="11.5"/><text class="m w" x="144.5" y="140" text-anchor="middle">file_upload()</text>
<rect class="pw" x="64.5" y="160.5" width="160" height="23" rx="11.5"/><text class="m w" x="144.5" y="176" text-anchor="middle">files()</text>
<rect class="pw" x="64.5" y="196.5" width="160" height="23" rx="11.5"/><text class="m w" x="144.5" y="212" text-anchor="middle">file_download()</text>
<rect class="pw" x="64.5" y="232.5" width="160" height="23" rx="11.5"/><text class="m w" x="144.5" y="248" text-anchor="middle">file_delete()</text>
<rect class="bl" x="348" y="48" width="264" height="328" rx="4"/>
<text class="w h big" x="364" y="84">File storage</text>
<text class="w" x="364" y="108">for the workflow</text>
<text class="m w" x="364" y="160">Yours only. Other users of the</text>
<text class="m w" x="364" y="180">workflow do not see your files.</text>
<text class="m w" x="364" y="220">Kept after each job ends.</text>
<text class="m w" x="364" y="260">Shared by all of your runs.</text>
<text class="m w" x="364" y="280">A file with the same name</text>
<text class="m w" x="364" y="300">replaces the earlier file.</text>
<rect class="o" x="672.5" y="48.5" width="239" height="196" rx="4"/>
<text class="h" x="688" y="80">Job: run 1</text>
<rect class="b" x="688.5" y="96.5" width="207" height="80" rx="4"/>
<text x="704" y="120">Local disk</text>
<rect class="p" x="704.5" y="128.5" width="48" height="23" rx="11.5"/><text class="m" x="728.5" y="144" text-anchor="middle">/tmp</text>
<text class="m" x="704" y="166">Deleted at job end</text>
<path class="ln" d="M720,177 L720,207" marker-end="url(#h)"/>
<text class="m" x="730" y="197">Copy finished files</text>
<rect class="p" x="688.5" y="208.5" width="160" height="23" rx="11.5"/><text class="m" x="768.5" y="224" text-anchor="middle">/function_user_data</text>
<rect class="o" x="672.5" y="260.5" width="239" height="116" rx="4"/>
<text class="h" x="688" y="292">Job: run 2</text>
<rect class="p" x="688.5" y="304.5" width="160" height="23" rx="11.5"/><text class="m" x="768.5" y="320" text-anchor="middle">/function_user_data</text>
<text class="m" x="688" y="348">Reads the files that</text>
<text class="m" x="688" y="364">earlier runs saved</text>
<path class="ln" d="M289,212 L347,212" marker-start="url(#t)" marker-end="url(#h)"/>
<path class="ln" d="M613,220 L687,220" marker-start="url(#t)" marker-end="url(#h)"/>
<path class="ln" d="M613,316 L687,316" marker-start="url(#t)" marker-end="url(#h)"/>
</svg>
