<svg width="847" height="548" viewBox="0 0 847 548" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">A managed workflow as a remote function call</title>
<style>
text{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-size:16px;fill:#161616}
.m{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:12px;fill:#525252}
.s{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:11px;fill:#525252}
.t{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:10px;fill:#525252}
.h{font-weight:600}.w{fill:#FFFFFF}.g{fill:#525252}
.bar{fill:#121619}.o{stroke:#161616}.c{stroke:#343A3F}
.b{fill:#F6F2FF;stroke:#8A3FFC}.bl{fill:#0F62FE}.rn{stroke:#0F62FE}
.fs{fill:#F4F4F4;stroke:#C6C6C6}.k{stroke:#161616}
.d{stroke:#525252;stroke-dasharray:2 2}.grp{stroke:#0F62FE;stroke-dasharray:4 3}
.p{fill:none;stroke:#8D8D8D;stroke-dasharray:2 2}
.ln{stroke:#161616;fill:none}.ah{fill:#161616}
.dl{stroke:#525252;stroke-dasharray:4 4;fill:none}.gd{stroke:#C6C6C6;stroke-dasharray:2 4}
.lb{stroke:#0F62FE;stroke-width:4;stroke-linecap:round}
.lbd{stroke:#0F62FE;stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round}
.x{stroke:#525252;stroke-width:1.25}
</style>
<defs>
<marker id="h" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker>
<marker id="t" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M8,0 L0,4 L8,8 z"/></marker>
</defs>
<rect class="bar" x="48" y="48" width="751" height="54" rx="4"/>
<text class="w" x="64" y="80">Your local notebook</text>
<text class="m w" x="783" y="79" text-anchor="end">run_workflow_remotely.ipynb</text>
<rect class="fs" x="48.5" y="150.5" width="750" height="119" rx="4"/>
<text x="64" y="182">Functions</text>
<rect class="k" x="64.5" y="198.5" width="216" height="55" rx="4"/>
<text x="80" y="232">Schema check</text>
<text class="m" x="265" y="231" text-anchor="end">optional</text>
<rect class="k" x="566.5" y="198.5" width="216" height="55" rx="4"/>
<text x="582" y="232">Stores the result</text>
<rect class="o" x="48.5" y="318.5" width="750" height="181" rx="4"/>
<text class="h" x="64" y="350">Managed workflow job</text>
<text class="m" x="783" y="349" text-anchor="end">my_workflow/my_workflow.py</text>
<rect class="b" x="64.5" y="366.5" width="216" height="117" rx="4"/>
<text x="80" y="394">Reads arguments</text>
<rect class="p" x="80.5" y="438.5" width="118" height="23" rx="11.5"/>
<text class="m" x="139.5" y="454" text-anchor="middle">get_arguments()</text>
<rect class="bl" x="315" y="366" width="217" height="118" rx="4"/>
<text class="w" x="331" y="394">Your code</text>
<text class="m w" x="331" y="434">Map, transpile, run</text>
<text class="m w" x="331" y="450">primitives, and</text>
<text class="m w" x="331" y="466">post-process</text>
<rect class="b" x="566.5" y="366.5" width="216" height="117" rx="4"/>
<text x="582" y="394">Returns a result</text>
<rect class="p" x="582.5" y="438.5" width="104" height="23" rx="11.5"/>
<text class="m" x="634.5" y="454" text-anchor="middle">save_result()</text>
<path class="ln" d="M281,425 L315,425" marker-end="url(#h)"/>
<path class="ln" d="M532,425 L566,425" marker-end="url(#h)"/>
<path class="ln" d="M160,102 L160,198" marker-end="url(#h)"/>
